# Jekyll configuration of the Z3-Noodler web site (https://verifit.github.io/z3-noodler/), built by
# GitHub's own Pages tooling (actions/jekyll-build-pages in .github/workflows/noodler-web.yml).
# All pages use _layouts/default.html and assets/css/site.css; the main pages are Markdown.
title: Z3-Noodler
description: An automata-based SMT solver for string constraints
repository: VeriFIT/z3-noodler
theme: null # no GitHub Pages theme (otherwise jekyll-theme-primer is added by default)

defaults:
  - scope: { path: "" }
    values: { layout: default }

# The navigation bar of every page (urls relative to the site's base URL).
nav:
  - { title: Home, url: / }
  - { title: Installation, url: /installation.html }
  - { title: Usage, url: /usage.html }
  - { title: Finding bugs, url: /bugs/ }
  - { title: Publications, url: /publications.html }
  - { title: Playground, url: /playground/ }
