name: Z3-Noodler Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Git ref (tag or sha) to build/release"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-publish-binaries:
    name: Build binary (${{ matrix.asset }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        # Asset names do not contain OS versions, so that links to
        # releases/latest/download/<asset> keep working when runners change.
        include:
          # Fully static, so that it does not depend on the glibc/libstdc++ of the runner.
          - os: linux
            asset: z3-noodler-linux-x86_64
            runner: ubuntu-24.04
            cmake_flags: -DCMAKE_EXE_LINKER_FLAGS=-static
          # Without a deployment target, the binary requires the macOS version of the runner.
          # 13.3 is the oldest macOS whose libc++ provides std::format (used by Mata).
          - os: macos
            asset: z3-noodler-macos-x86_64
            runner: macos-15-intel
            cmake_flags: -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3
          - os: macos
            asset: z3-noodler-macos-arm64
            runner: macos-15
            cmake_flags: -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3

    steps:
      - name: Checkout Z3-Noodler
        uses: actions/checkout@v6
        with: 
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Install dependencies (Linux)
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos'
        run: brew update && brew install cmake

      - name: Configure & Build Z3-Noodler
        run: |
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_flags }} ..
          make -j$(nproc || sysctl -n hw.ncpu)

      - name: Check binary (Linux)
        if: matrix.os == 'linux'
        run: |
          file build/z3
          file build/z3 | grep -q 'statically linked'

      - name: Check binary (macOS)
        if: matrix.os == 'macos'
        run: |
          otool -l build/z3 | grep -A4 LC_BUILD_VERSION
          otool -l build/z3 | grep -A4 LC_BUILD_VERSION | grep -q 'minos 13.3'

      - name: Package binary
        run: |
          build/z3 -version
          mv build/z3 build/${{ matrix.asset }}
          chmod +x build/${{ matrix.asset }}

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: build/${{ matrix.asset }}


  release:
    runs-on: ubuntu-latest
    needs: build-and-publish-binaries
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true # downloads all binaries to artifacts/ instead of putting each one in artifacts/<name>/

      - name: Restore executable permissions
        run: chmod +x artifacts/z3-noodler-*
  
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.ref || github.ref_name }}
          files: artifacts/z3-noodler-*
          generate_release_notes: true
